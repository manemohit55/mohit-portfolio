name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 0 * * 1"

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build
